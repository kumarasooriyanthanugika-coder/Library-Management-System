spring.application.name=demo

spring.datasource.url=jdbc:postgresql://localhost:5432/Student_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cors.origin.allowed=http://localhost:5173,http://127.0.0.1:5173


library.loan-period-days=3
library.daily-late-fine-rate=10.00
library.borrowing-charge=50.00
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.baseline-description=Existing library schema